[project]
name = "market-intelligence-hub"
version = "0.1.0"
description = "A unified data platform integrating multi-source financial market data with orchestration, warehousing, and API serving."
authors = [
    { name = "Alejandro Camerlengo", email = "your_email@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["data-engineering", "market-data", "airflow", "kafka", "bigquery", "fastapi"]

dependencies = [
    # HTTP & APIs
    "httpx>=0.27.0",
    "requests>=2.32.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Data processing
    "pandas>=2.2.0",
    "polars>=0.20.0",

    # Data Quality
    "great-expectations>=0.18.0",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Kafka
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",

    # GCP
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-storage>=2.17.0",

    # FastAPI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Resilience / Retries
    "tenacity>=3.8.0",

    # Airflow (installed separately via constraints)
    # apache-airflow = ">=2.9.0",

    # dbt
    "dbt-bigquery>=1.8.0",

    # Observability
    "prometheus-client>=0.20.0",

    # Logging
    "structlog>=24.2.0",

    # Finance
    "yfinance>=0.2.40",
]

[project.urls]
Homepage = "https://github.com/ale-camer/market-intelligence-hub"
Repository = "https://github.com/ale-camer/market-intelligence-hub"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "DTZ", "EM", "ISC", "PIE", "RET", "SIM", "TCH", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = [".venv", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
